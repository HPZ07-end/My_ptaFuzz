name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-regression:
    name: Public regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libeigen3-dev

      - name: Run public regression suite
        run: make -j2 test

      - name: Upload public-test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-regression-artifacts
          path: tests/output/
          if-no-files-found: ignore
          retention-days: 7

  pta-regression:
    name: PTA regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libeigen3-dev

      - name: Check PTA force accuracy
        run: make -j2 pta-force-standard

      - name: Check PTA fallback accuracy
        run: make -j2 pta-fallback-standard

      - name: Check PTA hard-operating-point fixture
        run: make -j2 test-pta-hard-op

      - name: Upload PTA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pta-regression-artifacts
          path: tests/output/pta/
          if-no-files-found: ignore
          retention-days: 7
